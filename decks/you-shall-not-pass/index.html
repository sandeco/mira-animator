/* @MIRA:THEME:START */
/* MIRA THEME: mira-dark (padrão) */
:root {
    --mira-primary: #FF904D;
    --mira-crop: #35D07F;
    --mira-bg: #000000;
    --mira-text: #ffffff;
    --mira-text-soft: rgba(255, 255, 255, 0.70);
    --mira-text-softer: rgba(255, 255, 255, 0.50);
    --mira-card-bg: rgba(255, 255, 255, 0.05);
    --mira-card-border: rgba(255, 255, 255, 0.10);
    --mira-glow-soft: rgba(255, 144, 77, 0.15);
    --mira-glow-strong: rgba(255, 144, 77, 0.25);
    --mira-icon-bg: rgba(255, 144, 77, 0.15);
    --mira-icon-border: rgba(255, 144, 77, 0.30);
    --mira-pill-bg: rgba(255, 255, 255, 0.04);
    --mira-pill-border: rgba(255, 255, 255, 0.08);
    --mira-stage-glow: rgba(255, 144, 77, 0.06);
    --mira-accent-2: #FFC766;
}

body {
    background: var(--mira-bg);
    min-height: 100vh;
    color: var(--mira-text);
    font-family: 'Inter', sans-serif;
}

.primary-color { color: var(--mira-primary); }
.primary-bg { background: var(--mira-primary); }

.anim-stage {
    width: 100%;
    height: clamp(400px, 60vh, 620px);
    background: radial-gradient(circle at 50% 50%, var(--mira-stage-glow), transparent 70%);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
}

.anim-stage svg {
    display: block;
    width: 100%;
    height: 100%;
}

.text-soft { color: var(--mira-text-soft); }
.text-softer { color: var(--mira-text-softer); }
/* @MIRA:THEME:END */

:root {
    --accent: var(--mira-primary);
    --bg: var(--mira-bg);
    --ink: var(--mira-text);
    --muted: var(--mira-text-soft);
    --line: var(--mira-card-border);
    /* quadro 16:9 que cabe inteiro na janela */
    --fmt-w: min(100vw, calc(100vh * 16 / 9));
    --fmt-h: calc(var(--fmt-w) * 9 / 16);
}
* { margin: 0; padding: 0; box-sizing: border-box; }

html { background: #333333; scroll-behavior: smooth; scroll-snap-type: y proximity; }
html { scrollbar-width: none; overflow-x: hidden; }
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

body {
    background: #333333;
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
}
body > section {
    position: relative;
    width: var(--fmt-w);
    height: var(--fmt-h);
    min-height: var(--fmt-h);
    margin: calc((100vh - var(--fmt-h)) / 2) 0;
    scroll-margin-top: calc((100vh - var(--fmt-h)) / 2);
    overflow: hidden;
    background: var(--bg);
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    isolation: isolate;
}

body > section:first-of-type h1,
body > section:first-of-type h2 { text-wrap: balance; }

h1 { font-size: clamp(34px, 7.4vh, 72px); line-height: 1.02; letter-spacing: -.02em; font-weight: 800; }
h2 { font-size: clamp(28px, 4.6vh, 46px); line-height: 1.1; letter-spacing: -.01em; font-weight: 800; }
p  { font-size: clamp(15px, 2vh, 20px); line-height: 1.5; color: var(--muted); }
.accent { color: var(--accent); }

.slide-main {
    width: 100%;
    height: 100%;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 50px;              /* área segura */
}

/* o palco É o slide: full-bleed, sem card */
.anim-stage {
    position: absolute;
    inset: 0;
    z-index: 0;
    width: auto;
    height: auto;
    min-height: 0;
    background: none;
    border-radius: 0;
}
.anim-stage svg { width: 100%; height: 100%; display: block; }

/* ---------- VINHETA ----------
   Camada FIXA DA TELA, não um elemento do SVG. A diferença decide se ela
   funciona: a câmera do autor escreve no viewBox, então qualquer retângulo
   desenhado dentro do SVG seria ampliado e cortado junto com a cena a cada
   zoom, e deixaria de escurecer as bordas do quadro. Aqui ela é irmã do
   palco e cobre a <section> inteira, imune a zoom, travelling e tremor.

   Estática de propósito: filtro de tela cheia animado é proibido no Mira,
   porque estoura o custo na captura de vídeo em taxa fixa. Um
   radial-gradient custa zero por quadro. */
.vinheta {
    position: absolute;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    background: radial-gradient(ellipse 78% 78% at 50% 50%,
        rgba(0, 0, 0, 0) 38%,
        rgba(0, 0, 0, .20) 66%,
        rgba(5, 2, 2, .50) 86%,
        rgba(5, 2, 2, .80) 100%);
}

<!-- === CENA ÚNICA · You Shall Not Pass ===
     Temperamento: tenso · ciclo 24 s · sequência narrativa com clímax
     único e cartela. O ciclo longo é deliberado: a cena É a história,
     e o corte do loop se esconde dentro do clarão branco. -->
<section>
    <!-- @MIRA:LOOP on -->
    <!-- @MIRA:VOLTA off -->
    <!-- @MIRA:CICLO 24 BEATS 24 -->
    <!-- @MIRA:PASSOS 0.71 9.10 -->
    <!-- @MIRA:FOCO 1 tipo=tensao amp=0.00240 beat=3.7369 dur=3.6708 -->
    <!-- @MIRA:FOCO 2 tipo=aproximar cx=376 cy=248 r=186 beat=4.25 dur=2.5 -->
    <!-- @MIRA:FOCO 3 tipo=tremor amp=0.01830 beat=7.413 dur=1.6872 -->
    <!-- @MIRA:FOCO 4 tipo=aproximar cx=535 cy=270 r=209 beat=8.5 dur=2 -->
    <!-- @MIRA:FOCO 5 tipo=tensao amp=0.00130 beat=9.0059 dur=8.9746 -->
    <!-- @MIRA:FOCO 6 tipo=aproximar cx=484 cy=274 r=263 beat=15.25 dur=1.5 -->
    <!-- ARMADILHA, LEIA ANTES DE COMENTAR AQUI DENTRO: o mira-foco.js
         varre os comentários desta section procurando o marcador de foco
         e casa por PREFIXO, sem exigir os campos. Escrever o nome do
         marcador em texto corrido, mesmo para dizer que ele nao existe,
         cria um cue fantasma de zoom com os valores padrao (centro do
         quadro, raio 220), e foi exatamente o "zoom que ninguem pediu"
         que apareceu aqui. Fale de camera SEM escrever o token. -->
    <div class="slide-main">
        <!-- @MIRA:SIZE 5/10 -->
        <!-- meet, NUNCA slice. Com `slice` o SVG é ampliado para cobrir a
             caixa e o excesso é cortado (igual background-size: cover), e
             qualquer erro de arredondamento na medição do palco vira zoom
             na tela. Com `meet` o quadro 0..960 x 0..540 aparece inteiro. -->
        <div class="anim-stage"><svg id="ysnp-svg" preserveAspectRatio="xMidYMid meet"></svg></div>
    </div>
    <div class="vinheta"></div>
</section>

                var idx = Math.floor((pw.y - BALROG.y) / BALROG.h * FAIXAS);
                if (idx >= 0 && idx < FAIXAS) baldes[idx].push(pw);
            }
            for (f = 0; f < FAIXAS; f++) {
                for (var k = 0; k < 2; k++) {
                    var lista = baldes[f];
                    if (!lista.length) continue;
                    var p = lista[Math.floor(rndF() * lista.length)];
                    LAMBIDAS.push({
                        comp: 15 + rndF() * 26,
                        larg: 3.2 + rndF() * 3.4,
                        fase: rndF() * 6.28,
                        el: lambeG.append('path').attr('fill', 'url(#ysnp-chama)')
                            .attr('transform', 'translate(' + p.x.toFixed(1) + ','
                                + p.y.toFixed(1) + ') rotate('
                                + (-90 + (rndF() - .5) * 44).toFixed(1) + ')')
                            .attr('opacity', 0)
                    });
                }
            }
        })();

        /* FUMAÇA DO CORPO: sai do bicho, não da caverna. Gradiente próprio,
           cinza morno e mais claro que a fumaça do abismo, porque esta é
           iluminada por baixo pelo fogo que a gera; a marrom escura do ar
           da caverna sumiria sobre o preto da silhueta. Fica DENTRO do
           gesto (acompanha quando ele se ergue) e ANTES da boca e dos
           olhos no documento, para nunca velar o que a cena está contando. */
        var gFumC = defs.append('radialGradient').attr('id', 'ysnp-fumaca-corpo');
        gFumC.append('stop').attr('offset', 0).attr('stop-color', '#6B5A4E').attr('stop-opacity', .46);
        gFumC.append('stop').attr('offset', .55).attr('stop-color', '#463830').attr('stop-opacity', .24);
        gFumC.append('stop').attr('offset', 1).attr('stop-color', '#2A211C').attr('stop-opacity', 0);
        var FUMACA_CORPO = [];
        for (var fc = 0; fc < 16; fc++) {
            FUMACA_CORPO.push({
                x0: BALROG.x + 30 + rndF() * (BALROG.w - 70),
                y0: BALROG.y + 60 + rndF() * (BALROG.h - 90),
                vel: 13 + rndF() * 16,
                vida: 120 + rndF() * 110,
                rx: 15 + rndF() * 26,
                achata: .55 + rndF() * .3,
                sway: 6 + rndF() * 16,
                fase: rndF() * 6.28,
                op: .3 + rndF() * .3,
                el: balrogGesto.append('ellipse')
                    .attr('fill', 'url(#ysnp-fumaca-corpo)').attr('opacity', 0)
            });
        }

        /* chamas da boca, DENTRO do gesto do Balrog, origem na BOCA.
           Três línguas em leque para o lado de Gandalf. */
        var chamas = balrogGesto.append('g')
            .attr('transform', 'translate(' + BOCA.x + ',' + BOCA.y + ') rotate(' + BOCA_ANG + ')');
        /* JATO TURBULENTO, não pétala escalada. A versão anterior eram três
           formas fixas girando e crescendo, e lia como origami: contorno liso
           e sempre idêntico. Aqui o contorno é RECALCULADO a cada quadro por
           dois senos de frequências diferentes, então o jato ferve nas bordas
           e nunca repete a mesma silhueta. Três camadas (externa, média e
           núcleo) dão o gradiente térmico que fogo real tem. */
        function pathJato(comp, larg, t, fase, quebra) {
            var N = 11, cima = [], baixo = [];
            for (var i = 0; i <= N; i++) {
                var u = i / N;
                var x = u * comp;
                /* fino na boca, cheio no primeiro terço, esgarçado na ponta */
                var env = Math.sin(Math.pow(u, .62) * Math.PI * .95);
                var turb = Math.sin(u * 8.5 + t * 11 + fase) * .30 * quebra
                    + Math.sin(u * 15 - t * 7.4 + fase * 2.3) * .18 * quebra;
                var h = larg * env * (1 + turb);
                /* a coluna inteira serpenteia, mais forte longe da boca */
                var desvio = (Math.sin(u * 3.4 + t * 5.1 + fase) * .5
                    + Math.sin(u * 6.1 - t * 3.3) * .25) * larg * u * 1.1;
                cima.push([x, -h + desvio]);
                baixo.push([x, h + desvio]);
            }
            var d = 'M' + cima[0][0].toFixed(1) + ' ' + cima[0][1].toFixed(1);
            for (var a = 1; a <= N; a++) d += 'L' + cima[a][0].toFixed(1) + ' ' + cima[a][1].toFixed(1);
            for (var b = N; b >= 0; b--) d += 'L' + baixo[b][0].toFixed(1) + ' ' + baixo[b][1].toFixed(1);
            return d + 'Z';
        }
        var jatoExt = chamas.append('path').attr('fill', 'url(#ysnp-chama)')
            .attr('filter', 'url(#ysnp-glow)').attr('opacity', 0);
        var jatoMed = chamas.append('path').attr('fill', '#FF9A2E').attr('opacity', 0);
        var jatoNuc = chamas.append('path').attr('fill', '#FFE9A8').attr('opacity', 0);
        /* cuspe: gotas de fogo que se desprendem e voam à frente do jato */
        var CUSPE = [];
        for (var cu = 0; cu < 22; cu++) {
            CUSPE.push({
                vel: 55 + rnd() * 90,
                vida: 46 + rnd() * 52,
                abre: (rnd() - .5) * .5,
                fase: rnd() * 6.28,
                r: .7 + rnd() * 1.9,
                el: chamas.append('circle').attr('r', 1)
                    .attr('fill', rnd() < .5 ? '#FFE9A8' : '#FF8A1E')
                    .attr('opacity', 0)
            });
        }

        /* OLHOS = CHAMAS, não bolas. Cada olho é uma labareda: base larga,
           ponta que lambe para cima e balança, língua interna mais clara,
           núcleo incandescente e faíscas que se soltam. A forma é redesenhada
           a cada quadro no segundo relógio, que é o que faz ler como fogo
           vivo em vez de um círculo aceso. */
        var olhos = balrogGesto.append('g');
        function pathChama(cx, cy, larg, alt, t, fase) {
            var pontaX = cx + Math.sin(t * 3.1 + fase) * larg * .75;
            var meioE = cx - larg * .55 + Math.sin(t * 4.3 + fase * 1.6) * larg * .28;
            var meioD = cx + larg * .55 + Math.sin(t * 3.7 + fase * 2.1) * larg * .28;
            var topo = cy - alt;
            return 'M' + (cx - larg) + ' ' + cy +
                ' C' + (cx - larg) + ' ' + (cy - alt * .34) +
                ' ' + meioE + ' ' + (cy - alt * .62) +
                ' ' + pontaX + ' ' + topo +
                ' C' + meioD + ' ' + (cy - alt * .62) +
                ' ' + (cx + larg) + ' ' + (cy - alt * .34) +
                ' ' + (cx + larg) + ' ' + cy +
                ' Q' + cx + ' ' + (cy + larg * .85) + ' ' + (cx - larg) + ' ' + cy + 'Z';
        }
        var olhoFogo = [OLHO_A, OLHO_B].map(function (p, i) {
            /* a chama sai PARA FRENTE, na direção que o Balrog encara (a
               direita), não para cima: o pathChama desenha subindo, e o
               giro de 85 graus no próprio olho deita a labareda para o
               lado, com um leve viés para cima que a mantém viva. */
            var g = olhos.append('g')
                .attr('transform', 'rotate(85 ' + p.x + ' ' + p.y + ')');
            return {
                p: p, fase: i * 2.4,
                halo: g.append('circle').attr('cx', p.x).attr('cy', p.y).attr('r', 7)
                    .attr('fill', 'url(#ysnp-brasa)').attr('opacity', 0),
                ext: g.append('path').attr('fill', 'url(#ysnp-olhofogo)')
                    .attr('filter', 'url(#ysnp-glow)').attr('opacity', 0),
                inte: g.append('path').attr('fill', '#FFDE8A').attr('opacity', 0),
                nucleo: g.append('circle').attr('cx', p.x).attr('cy', p.y).attr('r', 1.2)
                    .attr('fill', '#FFF6D5').attr('opacity', 0),
                faiscas: [0, 1, 2].map(function (j) {
                    return { fase: j * 2.1 + i, el: g.append('circle').attr('r', .55)
                        .attr('fill', '#FFC766').attr('opacity', 0) };
                })
            };
        });

        /* CHÃO DO BAQUE: cascalho e poeira que saltam quando o Balrog
           desaba. Ficam FORA do balrogGesto de propósito, porque pertencem
           ao chão e não ao corpo dele. */
        var chaoImpacto = atores.append('g');
        var CASCALHO = [];
        for (var q = 0; q < 24; q++) {
            var bx = 75 + rnd() * 285;
            CASCALHO.push({
                x0: bx, y0: 406 + rnd() * 16,
                dir: (bx < 217 ? -1 : 1) * (.4 + rnd()),
                dist: 12 + rnd() * 42,
                alt: 10 + rnd() * 36,
                r: .9 + rnd() * 2.1,
                el: chaoImpacto.append('circle').attr('r', 1)
                    .attr('fill', rnd() < .5 ? '#241610' : '#3a2519').attr('opacity', 0)
            });
        }
        var POEIRA = [];
        for (var w = 0; w < 6; w++) {
            POEIRA.push({
                x0: 95 + w * 50 + rnd() * 22, y0: 410 + rnd() * 10,
                rmax: 30 + rnd() * 42,
                el: chaoImpacto.append('ellipse')
                    .attr('fill', 'url(#ysnp-poeira)').attr('opacity', 0)
            });
        }

        /* Gandalf em DUAS peças recortadas do mesmo path fundido: corpo
           e braço do cajado. O braço gira no ombro (PIVO); a costura é
           uma elipse preta sobre a emenda. */
        var clipCorpo = defs.append('clipPath').attr('id', 'ysnp-clip-corpo');
        clipCorpo.append('path').attr('clip-rule', 'evenodd')
            .attr('d', 'M0 0 H960 V540 H0 Z M' + BRACO.x + ' ' + BRACO.y +
                ' h' + BRACO.w + ' v' + BRACO.h + ' h-' + BRACO.w + ' Z');
        var clipBraco = defs.append('clipPath').attr('id', 'ysnp-clip-braco');
        clipBraco.append('rect').attr('x', BRACO.x).attr('y', BRACO.y)
            .attr('width', BRACO.w).attr('height', BRACO.h);

        var gandalfGesto = atores.append('g');
        var gCorpo = gandalfGesto.append('g').attr('clip-path', 'url(#ysnp-clip-corpo)');
        var gCorpoFit = gCorpo.append('g');
        gCorpoFit.append('path').attr('d', PATH_GANDALF).attr('fill', '#000')
            .attr('fill-rule', 'evenodd');
        /* costura do ombro: cobre a emenda enquanto o braço gira */
        gandalfGesto.append('ellipse').attr('cx', PIVO.x).attr('cy', PIVO.y)
            .attr('rx', 9).attr('ry', 7).attr('fill', '#000');
        var bracoOuter = gandalfGesto.append('g');
        var gBraco = bracoOuter.append('g').attr('clip-path', 'url(#ysnp-clip-braco)');
        var gBracoFit = gBraco.append('g');
        gBracoFit.append('path').attr('d', PATH_GANDALF).attr('fill', '#000')
            .attr('fill-rule', 'evenodd');

        var fitGandalf = encaixar(gCorpoFit, GANDALF, false);
        gBracoFit.attr('transform', fitGandalf.tr);
        /* a bolinha cinza do gandalf.svg atravessa o encaixe: é dela que
           sai todo o brilho da vara */
        var CAJADO = fitGandalf.mundo(CAJADO_REF);

        /* A LUZ MORA DENTRO DO BRAÇO. Presa a bracoOuter, ela herda a
           rotação do ombro e a subida do corpo, então fica grudada na ponta
           em qualquer instante do gesto. Fora dele, ficava num ponto fixo e
           escorregava da vara quando Gandalf se erguia. Por isso a posição
           é CAJADO (a bolinha cinza do asset, com o braço em repouso) e não
           a ponta já girada: quem gira agora é o grupo. */
        var luzCajado = bracoOuter.append('g');
        var cajadoHalo = luzCajado.append('circle')
            .attr('cx', CAJADO.x).attr('cy', CAJADO.y).attr('r', 16)
            .attr('fill', 'url(#ysnp-branco)').attr('opacity', 0);
        /* PARTÍCULAS DE MAGIA: orbitam a ponta e sobem apagando, em branco
           frio. São o contraponto às brasas do Balrog, que sobem quentes. */
        var MAGIA = [];
        for (var mg = 0; mg < 30; mg++) {
            MAGIA.push({
                fase: rnd() * 6.28, vel: .5 + rnd() * 1.5,
                raio: 5 + rnd() * 16, alt: 16 + rnd() * 30,
                sobe: 8 + rnd() * 16, vida: 30 + rnd() * 34,
                r: .5 + rnd() * 1.3, op: .5 + rnd() * .5,
                el: luzCajado.append('circle').attr('r', 1)
                    .attr('fill', rnd() < .6 ? '#FFFFFF' : '#DCEBFF')
                    .attr('opacity', 0)
            });
        }
        var cajadoMiolo = luzCajado.append('circle')
            .attr('cx', CAJADO.x).attr('cy', CAJADO.y).attr('r', 4)
            .attr('fill', '#FFFFFF').attr('filter', 'url(#ysnp-glow)').attr('opacity', 0);

        /* ================= PLANO 4 · brasas do ambiente =================
           O ar do abismo é feito de brasa subindo, em TRÊS camadas de
           profundidade: fundo (muitas, pequenas e lentas, atrás dos atores),
           meio e frente (poucas, grandes e rápidas, na frente de tudo). É a
           diferença de tamanho e velocidade entre as camadas que dá o volume
           do ar, não a quantidade sozinha. */
        var frente = svg.append('g').attr('id', 'ysnp-frente');
        var BRASAS = [];
        for (var i = 0; i < 165; i++) {
            var camada = i % 7 === 0 ? 2 : (i % 3 === 0 ? 1 : 0);
            var alvoG = camada === 2 ? frente : (camada === 1 ? atores : fogo);
            BRASAS.push({
                camada: camada,
                x0: rnd() * 1040 - 40,
                y0: rnd() * 640,
                vel: camada === 2 ? 34 + rnd() * 46 : (camada === 1 ? 22 + rnd() * 30 : 11 + rnd() * 20),
                sway: 6 + rnd() * 22,
                giro: .35 + rnd() * 1.4,
                fase: rnd() * 6.28,
                r: camada === 2 ? 2.1 + rnd() * 2.2 : (camada === 1 ? 1.1 + rnd() * 1.3 : .55 + rnd() * .95),
                op: camada === 2 ? .45 + rnd() * .35 : (camada === 1 ? .35 + rnd() * .3 : .2 + rnd() * .28),
                el: alvoG.append('circle').attr('r', 1)
                    .attr('fill', camada === 2 ? '#FFD98A'
                        : (rnd() < .45 ? '#FFC766' : '#FF7A18'))
                    .attr('opacity', 0)
            });
        }
        /* fagulhas rápidas que sobem da lava sob o arco: nascem na fenda e
           apagam antes do topo, dando corrente ascendente ao vão da ponte */
        var FAGULHAS = [];
        for (var fg = 0; fg < 46; fg++) {
            FAGULHAS.push({
                x0: 330 + rnd() * 430,
                vel: 46 + rnd() * 62,
                vida: 150 + rnd() * 160,
                sway: 4 + rnd() * 12,
                fase: rnd() * 6.28,
                r: .6 + rnd() * 1.5,
                op: .4 + rnd() * .45,
                el: fogo.append('circle').attr('r', 1)
                    .attr('fill', rnd() < .5 ? '#FFE9A8' : '#FF9A2E')
                    .attr('opacity', 0)
            });
        }

        /* ================= AR DA CAVERNA: fumaça, névoa e cinzas =========
           Brasa sozinha lê como faísca no vazio. O que dá volume ao abismo
           é a matéria entre a câmera e o fundo: volutas de fumaça subindo,
           bancos de névoa quente derivando rente à lava e cinza fina em
           suspensão. Tudo em SVG (elipse com gradiente radial), nada de
           canvas nem filtro animado, e tudo no relógio da atmosfera. */
        var gFum = defs.append('radialGradient').attr('id', 'ysnp-fumaca');
        gFum.append('stop').attr('offset', 0).attr('stop-color', '#3A2418').attr('stop-opacity', .5);
        gFum.append('stop').attr('offset', .55).attr('stop-color', '#241610').attr('stop-opacity', .26);
        gFum.append('stop').attr('offset', 1).attr('stop-color', '#160D08').attr('stop-opacity', 0);
        var gNev = defs.append('radialGradient').attr('id', 'ysnp-nevoa');
        gNev.append('stop').attr('offset', 0).attr('stop-color', '#FFC183').attr('stop-opacity', .34);
        gNev.append('stop').attr('offset', .55).attr('stop-color', '#D2762F').attr('stop-opacity', .17);
        gNev.append('stop').attr('offset', 1).attr('stop-color', '#8A4416').attr('stop-opacity', 0);

        /* volutas de fumaça: sobem devagar, incham e apagam. Metade atrás
           dos atores e metade na frente, para a cena ter dentro e fora. */
        var FUMACA = [];
        for (var fu2 = 0; fu2 < 13; fu2++) {
            var naFrente = fu2 % 3 === 0;
            FUMACA.push({
                x0: 40 + rnd() * 880,
                y0: 380 + rnd() * 220,
                vel: 7 + rnd() * 14,
                vida: 300 + rnd() * 260,
                rx: (naFrente ? 78 : 52) + rnd() * 70,
                achata: .42 + rnd() * .26,
                sway: 12 + rnd() * 30,
                fase: rnd() * 6.28,
                op: (naFrente ? .30 : .22) + rnd() * .18,
                el: (naFrente ? frente : fogo).append('ellipse')
                    .attr('fill', 'url(#ysnp-fumaca)').attr('opacity', 0)
            });
        }

        /* névoa quente: bancos achatados rente à lava e ao pé da ponte,
           derivando de lado. É ela que faz o calor virar imagem. */
        var NEVOA = [];
        for (var nv = 0; nv < 11; nv++) {
            NEVOA.push({
                y0: 330 + rnd() * 170,
                vel: 5 + rnd() * 13,
                rx: 95 + rnd() * 130,
                achata: .17 + rnd() * .14,
                fase: rnd() * 6.28,
                op: .10 + rnd() * .13,
                el: fogo.append('ellipse')
                    .attr('fill', 'url(#ysnp-nevoa)').attr('opacity', 0)
            });
        }

        /* VAPOR DO VÃO DA PONTE: a lava sob o arco não pode ficar parada,
           ela ferve. Volutas quentes sobem do fundo, incham e apagam.

           Ficam presas ao vão por clipPath: a ponte é parte da FOTO de
           fundo, então qualquer coisa desenhada aqui passaria por cima da
           alvenaria se não fosse recortada. O path aproxima a curva do arco. */
        var clipVao = defs.append('clipPath').attr('id', 'ysnp-clip-vao');
        clipVao.append('path').attr('d', 'M326 545 L326 508 Q558 424 792 508 L792 545 Z');
        var gVao = fogo.append('g').attr('clip-path', 'url(#ysnp-clip-vao)');
        var VAPOR = [];
        for (var vp = 0; vp < 18; vp++) {
            VAPOR.push({
                x0: 336 + rnd() * 448,
                vel: 10 + rnd() * 20,
                vida: 86 + rnd() * 74,
                rx: 38 + rnd() * 74,
                achata: .3 + rnd() * .22,
                sway: 14 + rnd() * 32,
                fase: rnd() * 6.28,
                op: .18 + rnd() * .22,
                el: gVao.append('ellipse')
                    .attr('fill', 'url(#ysnp-nevoa)').attr('opacity', 0)
            });
        }

        /* cinza fina em suspensão: pontos escuros e mornos que sobem quase
           parados. Contrapeso às brasas claras, senão o ar só tem luz. */
        var CINZAS = [];
        for (var cz = 0; cz < 54; cz++) {
            CINZAS.push({
                x0: rnd() * 1000 - 20,
                y0: rnd() * 620,
                vel: 5 + rnd() * 13,
                sway: 10 + rnd() * 26,
                fase: rnd() * 6.28,
                r: .7 + rnd() * 1.9,
                op: .18 + rnd() * .3,
                el: fogo.append('circle').attr('r', 1)
                    .attr('fill', rnd() < .5 ? '#4A2E1E' : '#63432C')
                    .attr('opacity', 0)
            });
        }

        /* ================= camada de cima: clarão e cartela =================
           Fora dos planos de profundidade de propósito: clarão e cartela
           não fazem parallax, são a tela. */
        var topo = svg.append('g');
        /* A FALA: uma palavra por linha, empilhada e centrada na parede de
           rocha acima do Gandalf (área marcada pelo autor: x 398 a 651,
           y 85 a 320 no palco). O bloco fica centrado em x 524 e o miolo
           vertical em ~200, então sobra respiro em cima e embaixo. */
        var FALA = ['YOU', 'SHALL', 'NOT', 'PASS'];
        var legendaLinhas = FALA.map(function (palavra, i) {
            return topo.append('text')
                .attr('x', 524).attr('y', 183 + i * 17)
                .attr('text-anchor', 'middle')
                .attr('font-family', "'Cinzel Decorative', Georgia, serif")
                .attr('font-size', 13).attr('font-weight', 900)
                .attr('letter-spacing', '.06em')
                .attr('fill', '#F6E8C8').attr('filter', 'url(#ysnp-glow)')
                .attr('opacity', 0)
                .attr('data-mira-texto-fixo', '')
                .text(palavra);
        });
        /* o clarão nasce DA PONTA, então mora junto com a luz dentro do
           braço; cresce até engolir o quadro e ainda fica sob o branco */
        var bloom = luzCajado.append('circle')
            .attr('cx', CAJADO.x).attr('cy', CAJADO.y).attr('r', 10)
            .attr('fill', 'url(#ysnp-branco)').attr('opacity', 0);
        var branco = topo.append('rect')
            .attr('x', -20).attr('y', -20).attr('width', 1000).attr('height', 580)
            .attr('fill', '#FFFFFF').attr('opacity', 0)
            .attr('pointer-events', 'none');
        var marcaTitulo = topo.append('text')
            .attr('x', 480).attr('y', 262)
            .attr('text-anchor', 'middle')
            .attr('font-family', 'Inter, sans-serif')
            .attr('font-size', 58).attr('font-weight', 800)
            .attr('letter-spacing', '.16em')
            .attr('fill', '#141414').attr('opacity', 0)
            .attr('data-mira-texto-fixo', '')
            .text('MIRA ANIMATOR');
        var marcaAssin = topo.append('text')
            .attr('x', 480).attr('y', 302)
            .attr('text-anchor', 'middle')
            .attr('font-family', 'Inter, sans-serif')
            .attr('font-size', 22).attr('font-weight', 600)
            .attr('letter-spacing', '.34em')
            .attr('fill', '#FF904D').attr('opacity', 0)
            .attr('data-mira-texto-fixo', '')
            .text('by sandeco');

        /* ================= cinema ================= */
        /* SEM GRADE DE COR. A `brasa` aplicava vinheta 0.18, contraste 1.10,
           exposição -0.10 e grão sobre a cena inteira. Isso é tratamento de
           imagem de câmera, e o autor não quer nenhum. Sem ela, o que se vê
           é a arte crua: a foto da ponte e as silhuetas, sem correção. */
        var cena = MiraCinema.palco('ysnp-svg', { seed: 27193 });
        if (!cena) return;
        /* SEM PLANOS DE PROFUNDIDADE. O Prof.plano desloca cada camada por
           parallax, e camadas diferentes saem de registro entre si: o fogo
           da cabeça escorregava para longe dos olhos mesmo os dois usando a
           MESMA coordenada. Sem ele, tudo que é calculado no mesmo ponto
           aparece no mesmo ponto.

           A CÂMERA É DO AUTOR. Este script não escreve um cue sequer. O
           reset abaixo roda UMA vez, só para a cena não nascer com algum
           enquadramento herdado do motor; não é trava, então os marcadores
           @MIRA:FOCO e a tecla C funcionam normalmente por cima. */
        /* QUADRO CHEIO ENQUANTO NÃO HOUVER CÂMERA DECLARADA.

           O motor deixa a cena com um enquadramento herdado (783x441 em vez
           do quadro cheio), e um reset único não resolve porque ele é
           reescrito depois. A trava abaixo resolve, mas ela se DESLIGA
           SOZINHA no instante em que existir um `@MIRA:FOCO` de verdade na
           section: assim o quadro nasce cheio hoje e a câmera do autor
           funciona amanhã, sem ninguém precisar lembrar de remover nada.

           O teste exige dígito depois de FOCO, senão os comentários que
           explicam o marcador contariam como marcador. */
        var temCue = (function () {
            if (!cena.slide || !document.createNodeIterator) return false;
            var it = document.createNodeIterator(cena.slide, NodeFilter.SHOW_COMMENT), c;
            while ((c = it.nextNode())) {
                if (/@MIRA:FOCO\s+\d/.test(c.nodeValue || '')) return true;
            }
            return false;

        var tl = cena.tl;
        tl.to({}, { duration: 24 }, 0);   /* trava o ciclo em 24 s */

        /* --- beat 1.5 · o Balrog se ergue: agacha, sobe, SUSTENTA e desaba.
               É um ciclo fechado, não uma pose: quem sobe volta, e a volta
               é o acontecimento. O peso está na assimetria, sobe devagar
               (power2.out, 1,3 s) e desce rápido (power3.in, 0,42 s). --- */
        tl.to(n(balrogGesto), { rotation: 1.4, y: 3, svgOrigin: '215 417', duration: .35, ease: 'power1.in' }, 1.5);
        tl.to(n(balrogGesto), { rotation: -4, y: -16, svgOrigin: '215 417', duration: 1.3, ease: 'power2.out' }, 1.85);
        /* ele fica erguido enquanto ruge e cospe fogo, e então DESABA */
        tl.to(n(balrogGesto), { rotation: -5.2, y: -19, svgOrigin: '215 417', duration: .3, ease: 'power1.out' }, 6.6);
        tl.to(n(balrogGesto), { rotation: 0, y: 0, svgOrigin: '215 417', duration: .42, ease: 'power3.in' }, 6.95);
        /* o baque: um repique curto do próprio corpo depois de bater */
        tl.to(n(balrogGesto), { y: -4, duration: .12, ease: 'power2.out' }, 7.37);
        tl.to(n(balrogGesto), { y: 0, duration: .5, ease: 'power2.out' }, 7.49);

        /* --- beat 7.37 · O CHÃO responde ao baque: cascalho salta e a poeira
               abre. O TREMOR DE TELA não está aqui: câmera é do autor, pelos
               marcadores @MIRA:FOCO ou pela tecla C. Um `tipo=tremor` em
               beat=7.37 com dur=0.35 cai exatamente neste impacto. --- */
        tl.set(boost, { impacto: 1 }, 7.37);
        tl.to(boost, { impacto: 0, duration: 1.15, ease: 'none' }, 7.38);

        /* --- beat 3.4 · os olhos flamejam (a câmera já chegou) --- */
        tl.to(boost, { olho: 1, duration: .5, ease: 'power2.out' }, 3.4);
        tl.to(boost, { olho: .25, duration: 1.4, ease: 'sine.inOut' }, 6.2);

        /* --- beats 4.6 e 5.8 · jatos de chama; o tremor responde ao 1º --- */
        /* O jato agora é só uma INTENSIDADE na timeline; a forma nasce no
           segundo relógio, quadro a quadro. Ataque seco e queda longa, que
           é como fogo cuspido se comporta: explode e depois esmorece. */
        tl.to(boost, { jato: 1, duration: .22, ease: 'power3.out' }, 4.6);
        tl.to(boost, { jato: 0, duration: .95, ease: 'power2.in' }, 4.95);
        tl.to(boost, { fogo: .8, duration: .3, ease: 'power2.out' }, 4.6);
        tl.to(boost, { jato: 1.5, duration: .26, ease: 'power3.out' }, 5.8);
        tl.to(boost, { jato: 0, duration: 1.25, ease: 'power2.in' }, 6.2);
        tl.to(boost, { fogo: 1, duration: .3, ease: 'power2.out' }, 5.8);
        tl.to(boost, { fogo: .2, duration: 1.6, ease: 'sine.inOut' }, 6.6);

        /* --- o corpo pega fogo: acende com o 1º jato, toma tudo no 2º e
               QUEIMA ENQUANTO ELE ESTÁ ERGUIDO. O baque em 7,37 apaga:
               ele desaba, o chão treme e a chama morre de uma vez. Daí em
               diante o bicho é vulto preto de novo, só fumegando. --- */
        tl.to(boost, { corpo: .5, duration: 1.2, ease: 'power2.out' }, 4.75);
        tl.to(boost, { corpo: 1, duration: 1.5, ease: 'power2.out' }, 5.95);
        tl.to(boost, { corpo: 0, duration: .5, ease: 'power2.in' }, 7.37);

        /* --- a fumaça: um fio dela já sobe enquanto o corpo queima, e o
               BAQUE é que a solta de vez, porque é ali que o fogo é
               abafado. Ela fica no ar por toda a fala do Gandalf, sozinha,
               e só se apaga quando a luz do cajado toma a cena. --- */
        tl.to(boost, { fumaca: .4, duration: 1.4, ease: 'power1.out' }, 5.35);
        tl.to(boost, { fumaca: 1, duration: .9, ease: 'power2.out' }, 7.4);
        tl.to(boost, { fumaca: .72, duration: 2.4, ease: 'sine.inOut' }, 9.2);
        tl.to(boost, { fumaca: 0, duration: 1.8, ease: 'sine.in' }, 13.4);

        /* --- beat 8.0 · Gandalf: antecipação (o braço desce um nada,
               o corpo cede), e então o cajado SOBE girando no ombro --- */
        tl.to(n(bracoOuter), { rotation: -5, svgOrigin: PIVO.x + ' ' + PIVO.y, duration: .45, ease: 'power1.in' }, 8.0);
        tl.to(n(gandalfGesto), { y: 3, duration: .45, ease: 'power1.in' }, 8.0);
        tl.to(n(bracoOuter), { rotation: ANG_BRACO, svgOrigin: PIVO.x + ' ' + PIVO.y, duration: .9, ease: 'power4.out' }, 8.45);
        tl.to(n(gandalfGesto), { y: -5, duration: .9, ease: 'power4.out' }, 8.45);
        /* a luz acende DEPOIS do gesto (causa antes do efeito) */
        tl.to(n(cajadoMiolo), { attr: { opacity: .9 }, duration: .4, ease: 'sine.out' }, 8.9);
        tl.to(n(cajadoHalo), { attr: { opacity: .5 }, duration: .6, ease: 'sine.out' }, 9.0);
        /* a magia sobe junto com a luz e se adensa antes do clarão */
        tl.to(boost, { magia: 1, duration: .9, ease: 'sine.out' }, 8.95);
        tl.to(boost, { magia: 1.8, duration: 1.4, ease: 'power2.in' }, 13.0);

        /* --- beat 9.8 · a fala, enquanto a câmera segura o plano médio --- */
        /* palavra por palavra, DEVAGAR (o autor pediu 3/10 de velocidade):
           cada linha leva 1,2 s para surgir e espera 0,55 s antes da
           próxima. A última fecha por volta de 12,2 s, e o bloco sai a
           tempo do brilho tomar a cena em 13. */
        legendaLinhas.forEach(function (linha, i) {
            tl.to(n(linha), { attr: { opacity: 1 }, duration: 1.2, ease: 'sine.out' }, 9.3 + i * .55);
            /* SEM fade de saída: a frase fica no ar até o CLARÃO a cobrir.
               O `branco` é criado depois dela no grupo `topo`, então passa
               por cima; quem apaga a fala é a luz, não uma transição. O
               opacity volta a zero lá no reset invisível de 15,8 s. */
        });

        /* --- beat 13.2 · o mundo cede a luz ao cajado --- */
        tl.to(n(cajadoMiolo), { attr: { r: 9 }, duration: 1.4, ease: 'power2.in' }, 13.0);
        tl.to(n(cajadoHalo), { attr: { r: 42, opacity: .85 }, duration: 1.4, ease: 'power2.in' }, 13.0);
        tl.to(boost, { mundoEscuro: 1, duration: 1.4, ease: 'sine.inOut' }, 13.0);

        /* --- beat 14.4 · o clarão: bloom da ponta do cajado engole a cena --- */
        tl.to(n(bloom), { attr: { opacity: 1, r: 780 }, duration: 1.1, ease: 'power4.in' }, 14.4);
        tl.to(n(branco), { attr: { opacity: 1 }, duration: .45, ease: 'power2.in' }, 15.1);
        /* a vinheta sai JUNTO com o branco: cantos escuros sobre tela branca
           denunciam a moldura e roubam o estouro de luz. Ela volta no mesmo
           tempo em que o branco dissolve de volta na cena, lá em 21.8. */
        var elVinheta = document.querySelector('.vinheta');
        if (elVinheta) {
            tl.to(elVinheta, { opacity: 0, duration: .45, ease: 'power2.in' }, 15.1);
            tl.to(elVinheta, { opacity: 1, duration: 2.0, ease: 'sine.inOut' }, 21.8);
        }

        /* --- sob o branco: tudo volta ao começo, sem ninguém ver --- */
        tl.set(n(balrogGesto), { rotation: 0, y: 0 }, 15.8);
        tl.set(n(gandalfGesto), { y: 0 }, 15.8);
        tl.set(n(bracoOuter), { rotation: 0 }, 15.8);
        tl.set(n(cajadoMiolo), { attr: { opacity: 0, r: 4 } }, 15.8);
        tl.set(n(cajadoHalo), { attr: { opacity: 0, r: 16 } }, 15.8);
        tl.set(n(bloom), { attr: { opacity: 0, r: 10 } }, 15.8);
        tl.set(boost, { olho: 0, fogo: 0, corpo: 0, fumaca: 0, mundoEscuro: 0, impacto: 0, magia: 0, jato: 0 }, 15.8);
        /* a fala só desaparece aqui, escondida sob o branco já pleno */
        legendaLinhas.forEach(function (linha) {
            tl.set(n(linha), { attr: { opacity: 0 } }, 15.8);
        });

        /* --- beat 16.6 · a cartela --- */
        tl.fromTo(n(marcaTitulo), { attr: { opacity: 0 }, y: 10 },
            { attr: { opacity: 1 }, y: 0, duration: 1.2, ease: 'sine.out' }, 16.6);
        tl.fromTo(n(marcaAssin), { attr: { opacity: 0 }, y: 8 },
            { attr: { opacity: 1 }, y: 0, duration: 1.0, ease: 'sine.out' }, 17.3);
        tl.to(n(marcaAssin), { attr: { opacity: 0 }, duration: .8, ease: 'sine.in' }, 20.2);
        tl.to(n(marcaTitulo), { attr: { opacity: 0 }, duration: 1.0, ease: 'sine.in' }, 20.4);

        /* --- beat 21.8 · o branco dissolve na cena inicial: o corte do

        tl.to(n(branco), { attr: { opacity: 0 }, duration: 2.0, ease: 'sine.inOut' }, 21.8);

        /* ================= atmosfera: o segundo relógio ================= */
        var ultimo = null, acc = 0;
        cena.aoAtualizar(function () {
            /* sem cue declarado, o quadro é o quadro cheio (ver temCue) */

            if (ultimo !== null) acc += Math.min(0.1, agora - ultimo);

            asaOuter.attr('transform', 'rotate('
                + (Math.sin(t * .52) * 1.9 + Math.sin(t * .23 + 1.1) * .9)
                + ' ' + PIVO_ASA.x + ' ' + PIVO_ASA.y + ')');

            /* brasas do ambiente: sobem, são sopradas de lado e cintilam.
               Cada camada tem seu próprio ritmo de deriva, senão as 165
               viram uma cortina só e o ar perde profundidade. */
            for (var i = 0; i < BRASAS.length; i++) {
                var b = BRASAS[i];
                var faixa = 640;
                var y = ((b.y0 - t * b.vel) % faixa + faixa) % faixa - 50;
                var x = b.x0 + Math.sin(t * .6 * b.giro + b.fase) * b.sway
                    + Math.sin(t * .21 + b.fase * .5) * b.sway * .6;
                var tw = .55 + .45 * Math.sin(t * 2.4 * b.giro + b.fase * 2);
                /* some perto do topo, para não desaparecer no meio do nada */

                b.el.attr('cx', x).attr('cy', y).attr('r', b.r)
                    .attr('opacity', b.op * tw * borda * (1 - boost.mundoEscuro * .6));
            }
            /* vapor do vão: sobe da lava, incha e apaga. É o que tira a
               sensação de foto parada embaixo da ponte. */
            for (var vi = 0; vi < VAPOR.length; vi++) {
                var vv = VAPOR[vi];
                var pv = ((t * vv.vel + vv.fase * 70) % vv.vida) / vv.vida;
                var rxv = vv.rx * (.58 + pv * .85);
                vv.el.attr('cx', vv.x0 + Math.sin(t * .5 + vv.fase) * vv.sway)
                    .attr('cy', 548 - pv * vv.vida)
                    .attr('rx', rxv).attr('ry', rxv * vv.achata)
                    .attr('opacity', vv.op * Math.sin(pv * Math.PI)
                        * (1 - boost.mundoEscuro * .7));
            }

            /* volutas de fumaça: sobem, incham e apagam nas pontas do ciclo */
            for (var vf = 0; vf < FUMACA.length; vf++) {
                var fm = FUMACA[vf];
                var pf = ((t * fm.vel + fm.fase * 120) % fm.vida) / fm.vida;
                var rxAtual = fm.rx * (.55 + pf * .95);
                /* entra e sai suave: seno do ciclo, sem corte visível */
                var envF = Math.sin(pf * Math.PI);
                fm.el.attr('cx', fm.x0 + Math.sin(t * .13 + fm.fase) * fm.sway)
                    .attr('cy', fm.y0 - pf * (fm.vida * .55))
                    .attr('rx', rxAtual).attr('ry', rxAtual * fm.achata)

            }
            /* névoa quente: deriva lateral com wrap, respirando devagar */
            for (var nb = 0; nb < NEVOA.length; nb++) {
                var nn = NEVOA[nb];
                var faixaN = 960 + nn.rx * 2 + 140;
                var xn = ((t * nn.vel + nn.fase * 150) % faixaN + faixaN) % faixaN - nn.rx - 70;
                nn.el.attr('cx', xn)
                    .attr('cy', nn.y0 + Math.sin(t * .2 + nn.fase) * 9)
                    .attr('rx', nn.rx).attr('ry', nn.rx * nn.achata)

                        * (1 - boost.mundoEscuro * .65));

            for (var cf = 0; cf < CINZAS.length; cf++) {

                    .attr('cy', yc).attr('r', cz2.r)
                    .attr('opacity', cz2.op * Math.min(1, Math.max(0, yc / 80))
                        * (1 - boost.mundoEscuro * .7));
            }

            /* fagulhas da lava: sobem do vão do arco e apagam no caminho */
            for (var fi = 0; fi < FAGULHAS.length; fi++) {
                var fu = FAGULHAS[fi];
                var perc = ((t * fu.vel + fu.fase * 90) % fu.vida) / fu.vida;
                fu.el.attr('cx', fu.x0 + Math.sin(t * 1.1 + fu.fase) * fu.sway * (1 + perc))
                    .attr('cy', 520 - perc * fu.vida)
                    .attr('r', fu.r * (1 - perc * .55))
                    .attr('opacity', fu.op * (1 - perc) * (1 - perc * .3)
                        * (1 - boost.mundoEscuro * .6));
            }

            /* o fogo do mundo respira; surge junto com os jatos (boost.fogo) */
            var resp = .5 + .5 * Math.sin(t * .8);
            fogoBalrog.attr('opacity', (.30 + .10 * resp + .28 * boost.fogo) * (1 - boost.mundoEscuro * .55));
            fogoGandalf.attr('opacity', (.22 + .08 * Math.sin(t * .65 + 1.4)) * (1 - boost.mundoEscuro * .4));
            fogoTunel.attr('opacity', (.18 + .10 * Math.sin(t * .5 + 2.6)) * (1 - boost.mundoEscuro * .5));
            /* a poça de lava também deriva e muda de forma, senão o brilho
               do vão fica cravado no mesmo lugar a cena inteira */
            fogoLava.attr('opacity', (.16 + .09 * Math.sin(t * .45 + .7)) * (1 - boost.mundoEscuro * .5))
                .attr('cx', 490 + Math.sin(t * .17) * 46)
                .attr('cy', 505 + Math.sin(t * .29 + 2.1) * 7)
                .attr('rx', 330 + Math.sin(t * .23 + 1.3) * 34);

            /* o véu escurece quando a história pede o clímax */
            veu.attr('opacity', .22 + .34 * boost.mundoEscuro);

            /* olhos: faíscam de vez em quando sozinhos, e a história
               soma o flare dela por cima */
            var amb = Math.max(0, Math.sin(t * .31) * Math.sin(t * .53 + 1.7));
            var faisca = amb > .86 ? (amb - .86) / .14 * .4 : 0;
            var olho = Math.min(1, faisca + boost.olho);
            /* a chama de cada olho: altura pulsa, ponta balança, faíscas

            var vivo = Math.max(.22, olho);
            for (var k = 0; k < olhoFogo.length; k++) {
                var of = olhoFogo[k];
                var pulso = .82 + .34 * Math.sin(t * 5.3 + of.fase * 1.9);
                var alt = (4.4 + 9.5 * vivo) * pulso;
                var larg = 1.9 + 1.5 * vivo;
                of.ext.attr('d', pathChama(of.p.x, of.p.y + 1.6, larg, alt, t, of.fase))
                    .attr('opacity', .92 * vivo);
                of.inte.attr('d', pathChama(of.p.x, of.p.y + 1.2, larg * .52, alt * .55,
                        t * 1.35, of.fase + 1.3))
                    .attr('opacity', .95 * vivo);
                of.nucleo.attr('opacity', vivo).attr('r', .9 + .9 * vivo);
                of.halo.attr('opacity', .5 * vivo).attr('r', 3.5 + 4.5 * vivo);
                for (var fj = 0; fj < of.faiscas.length; fj++) {
                    var fa = of.faiscas[fj];
                    var ciclo = ((t * .9 + fa.fase) % 1);
                    fa.el.attr('cx', of.p.x + Math.sin((t + fa.fase) * 2.3) * 2.4)
                        .attr('cy', of.p.y - 2 - ciclo * (10 + 9 * vivo))
                        .attr('r', .5 * (1 - ciclo * .6))
                        .attr('opacity', vivo * (1 - ciclo) * .85);
                }
            }
            /* o fogo atrás da cabeça acompanha olhos e jatos */
            fogoCabeca.attr('opacity',
                (.14 + .07 * Math.sin(t * .7 + .9) + .45 * boost.olho + .25 * boost.fogo)
                * (1 - boost.mundoEscuro * .5));

            /* fogo no corpo: a maré de ignição sobe e as brasas internas
               vazam pela silhueta. Com boost.corpo em 0 sobra só rescaldo
               nos pés, que é o estado de repouso do bicho. */

               cospe fogo e os olhos flamejam, o couro acende junto. O
               boost.corpo MULTIPLICA em vez de somar, e é o que garante
               que, apagado o corpo no baque, os olhos ainda acesos não
               deixem um resto de brasa no couro. */
            var ign = Math.min(1, boost.corpo * (1 + boost.jato * .22 + boost.olho * .16));
            var nivel = Math.min(1, .16 + ign * .96);
            var lamber = .58 + .42 * Math.sin(t * 3.1);
            mareFogo.attr('y', BALROG.y + (1 - nivel) * BALROG.h)
                .attr('height', nivel * BALROG.h)
                .attr('opacity', (.10 + .52 * ign) * lamber * (1 - boost.mundoEscuro * .85));
            /* o banho uniforme e a borda em brasa: é o par que faz o corpo
               INTEIRO queimar, e não só a faixa por onde a maré passou */
            /* os dois partem de ZERO: em repouso o Balrog é vulto preto, e
               quem acende é a história. Um piso constante aqui entregaria
               o bicho já morno antes da primeira labareda. */
            brasaCorpo.attr('opacity', .34 * ign * (.72 + .28 * lamber)
                * (1 - boost.mundoEscuro * .85));
            contorno.attr('opacity', .80 * ign * (.6 + .4 * lamber)
                * (1 - boost.mundoEscuro * .85));
            for (var lb2 = 0; lb2 < LAMBIDAS.length; lb2++) {
                var lb = LAMBIDAS[lb2];
                if (ign < .02) { lb.el.attr('opacity', 0); continue; }
                /* cada língua respira no seu tempo, então nunca sobem juntas */
                var puxa = .55 + .45 * Math.sin(t * 4.2 + lb.fase);
                lb.el.attr('d', pathJato(lb.comp * (.4 + .8 * ign) * puxa,
                        lb.larg * (.6 + .5 * ign), t, lb.fase, 1))
                    .attr('opacity', Math.min(.92, ign) * (.45 + .55 * puxa)
                        * (1 - boost.mundoEscuro * .85));
            }
            for (var m = 0; m < INTERNAS.length; m++) {
                var pi = INTERNAS[m];
                var faixaI = BALROG.h + 40;
                var subiu = ((pi.y0 + t * pi.vel * (.6 + ign)) % faixaI + faixaI) % faixaI;
                var yi = BALROG.y + BALROG.h - subiu;
                var vida = 1 - Math.abs(subiu / BALROG.h - .5) * .5;
                pi.el.attr('cx', pi.x0 + Math.sin(t * 1.1 + pi.fase) * pi.sway)
                    .attr('cy', yi).attr('r', pi.r * (.7 + .6 * ign))
                    .attr('opacity', pi.op * (.3 + .7 * ign) * vida * lamber
                        * (1 - boost.mundoEscuro * .85));
            }
            /* as faíscas que deixam o corpo e apagam subindo */
            for (var ei = 0; ei < ESCAPAM.length; ei++) {
                var ep = ESCAPAM[ei];
                var sub = (t * ep.vel + ep.fase * 37) % ep.vida;
                var fr = sub / ep.vida;
                ep.el.attr('cx', ep.x0 + Math.sin(t * 1.4 + ep.fase) * ep.sway)
                    .attr('cy', ep.y0 - sub)
                    .attr('r', ep.r * (1 - fr * .55))
                    .attr('opacity', (.18 + .82 * ign) * (1 - fr) * .85
                        * (1 - boost.mundoEscuro * .85));
            }
            /* a fumaça do corpo: sobe, incha e apaga. Nasce em `fr`=0 no
               couro e morre no ar, com o pico de opacidade no meio do
               percurso (seno), que é o que dá o volume da voluta. */
            var fum = boost.fumaca;
            for (var fk = 0; fk < FUMACA_CORPO.length; fk++) {
                var fp = FUMACA_CORPO[fk];
                if (fum < .02) { fp.el.attr('opacity', 0); continue; }
                var sobe = (t * fp.vel + fp.fase * 53) % fp.vida;
                var frf = sobe / fp.vida;
                var raio = fp.rx * (.35 + frf * 1.25);
                fp.el.attr('cx', fp.x0 + Math.sin(t * .9 + fp.fase) * fp.sway * (.3 + frf))
                    .attr('cy', fp.y0 - sobe)
                    .attr('rx', raio).attr('ry', raio * fp.achata)
                    .attr('opacity', fp.op * fum * Math.sin(frf * Math.PI)
                        * (1 - boost.mundoEscuro * .85));
            }

            /* o baque no chão: cascalho salta em parábola e a poeira abre.
               boost.impacto vai de 1 a 0, então prog anda de 0 a 1. */
            var prog = boost.impacto > 0 ? 1 - boost.impacto : -1;
            for (var ci = 0; ci < CASCALHO.length; ci++) {
                var cc = CASCALHO[ci];
                if (prog < 0) { cc.el.attr('opacity', 0); continue; }
                cc.el.attr('cx', cc.x0 + cc.dir * prog * cc.dist)
                    .attr('cy', cc.y0 - Math.sin(prog * Math.PI) * cc.alt)
                    .attr('r', cc.r).attr('opacity', .9 * (1 - prog));
            }
            for (var wi = 0; wi < POEIRA.length; wi++) {
                var pw = POEIRA[wi];
                if (prog < 0) { pw.el.attr('opacity', 0); continue; }
                var rr = 8 + pw.rmax * prog;
                pw.el.attr('cx', pw.x0).attr('cy', pw.y0 - prog * 12)
                    .attr('rx', rr).attr('ry', rr * .42)
                    .attr('opacity', .55 * (1 - prog));
            }

            /* JATO DA BOCA: forma recalculada por quadro. O comprimento
               responde ao boost, mas a silhueta ferve sozinha, então nem
               dois quadros do mesmo jato são iguais. */
            var jt = boost.jato;
            if (jt > .01) {
                var compJ = 62 * jt * (.9 + .12 * Math.sin(t * 13));
                var largJ = 11 * Math.min(1.25, jt);
                jatoExt.attr('d', pathJato(compJ, largJ, t, 0, 1))
                    .attr('opacity', Math.min(.95, jt * .95));
                jatoMed.attr('d', pathJato(compJ * .76, largJ * .60, t, 1.7, .85))
                    .attr('opacity', Math.min(.9, jt * .9));
                jatoNuc.attr('d', pathJato(compJ * .46, largJ * .33, t, 3.1, .6))
                    .attr('opacity', Math.min(.95, jt));
            } else {
                jatoExt.attr('opacity', 0);
                jatoMed.attr('opacity', 0);
                jatoNuc.attr('opacity', 0);
            }
            /* cuspe: gotas que se soltam e voam à frente, com queda leve */
            for (var cq = 0; cq < CUSPE.length; cq++) {
                var cp = CUSPE[cq];
                if (jt <= .01) { cp.el.attr('opacity', 0); continue; }
                var pc = ((t * cp.vel + cp.fase * 60) % cp.vida) / cp.vida;
                var dist = pc * cp.vida * (.6 + jt * .5);
                cp.el.attr('cx', dist)
                    .attr('cy', cp.abre * dist + dist * dist * .0016)
                    .attr('r', cp.r * (1 - pc * .5))
                    .attr('opacity', Math.min(1, jt) * (1 - pc) * .9);
            }

            /* magia na ponta da vara: as partículas orbitam e sobem */
            var mag = Math.min(1.8, boost.magia);
            for (var mi = 0; mi < MAGIA.length; mi++) {
                var mp = MAGIA[mi];
                if (mag <= .001) { mp.el.attr('opacity', 0); continue; }
                var ang = t * mp.vel + mp.fase;
                var raio = mp.raio * (.45 + .55 * Math.sin(ang * .8)) * (.55 + .45 * mag);
                var sobe = ((t * mp.sobe + mp.fase * 24) % mp.vida) / mp.vida;
                mp.el.attr('cx', CAJADO.x + Math.cos(ang) * raio)
                    .attr('cy', CAJADO.y + Math.sin(ang * 1.3) * raio * .55 - sobe * mp.alt)
                    .attr('r', mp.r * (1 - sobe * .5) * (.7 + .5 * mag))
                    .attr('opacity', Math.min(1, mag) * (1 - sobe) * mp.op);
            }
        });
    }

    function ligar() {
        if (!window.MiraCinema || !window.Prof || !window.gsap) {
            console.warn('[ysnp] mira-cinema.js ausente: a cena não sobe sem ele.');
            return;
        }
        cenaYSNP();
    }
    window.addEventListener('load', ligar);
})();
</script>

<script>
/* Navegação slide a slide (padrão do deck cinema), com as guardas
   dos modos de edição e pintura. */
(function () {
    'use strict';
    var secs = Array.prototype.slice.call(document.querySelectorAll('body > section'));
    function atual() {
        var meio = window.innerHeight / 2, achado = 0;
        secs.forEach(function (s, i) {
            var r = s.getBoundingClientRect();
            if (r.top <= meio && r.bottom > meio) achado = i;
        });
        return achado;
    }
    function ir(d) {
        var de = atual(), i = Math.max(0, Math.min(secs.length - 1, de + d));
        if (i === de) return;
        secs[i].scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    document.addEventListener('keydown', function (e) {
        if (document.body.classList.contains('me-on') || document.body.classList.contains('md-on')) return;
        var t = e.target;
        if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || ''))) return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (['ArrowDown', 'ArrowRight', 'PageDown', ' ', 'Spacebar'].indexOf(e.key) !== -1) { e.preventDefault(); ir(1); }
        else if (['ArrowUp', 'ArrowLeft', 'PageUp'].indexOf(e.key) !== -1) { e.preventDefault(); ir(-1); }
    });

    /* desenho (tecla P) pertence ao slide */
    var porSlide = {}, ultimo = -1;
    function trocarDesenho() {
        if (window.__MIRA_REMOTE_STAGE__) return;
        var md = window.miraDraw;
        if (!md || !md.getShapes || !md.setShapes) return;
        var i = atual();
        if (i === ultimo) return;
        if (ultimo >= 0) porSlide[ultimo] = md.getShapes();
        ultimo = i;
        md.setShapes(porSlide[i] || []);
    }
    window.addEventListener('load', function () { ultimo = atual(); });
    window.addEventListener('scroll', trocarDesenho, { passive: true });
})();
</script>
